    <g fill="#142a46" font-size="25" font-weight="600"><text x="94" y="347">Labor rights</text><text x="454" y="347">Worker voice &amp; welfare</text><text x="814" y="347">Health &amp; safety</text><text x="94" y="477">Environment</text><text x="454" y="477">Business ethics</text><text x="814" y="477">Training &amp; review</text></g>
