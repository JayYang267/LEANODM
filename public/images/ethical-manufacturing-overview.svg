    <text x="72" y="168" fill="#142a46" font-size="58" font-weight="700">Ethical Manufacturing</text>
    <text x="72" y="216" fill="#506178" font-size="25">Documented practices. Reviewable evidence.</text>
    <g fill="white" stroke="#cbd7e7"><rect x="72" y="268" width="337" height="108" rx="4"/><rect x="432" y="268" width="337" height="108" rx="4"/><rect x="792" y="268" width="337" height="108" rx="4"/><rect x="72" y="398" width="337" height="108" rx="4"/><rect x="432" y="398" width="337" height="108" rx="4"/><rect x="792" y="398" width="337" height="108" rx="4"/></g>
